<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D MTZ Inversion - Login</title>
    <link rel="stylesheet" href="/css/styles.css">
    <link rel="icon" type="image/gif" href="a_ficon.gif">

    <script src="https://www.gstatic.com/firebasejs/10.10.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.10.0/firebase-auth-compat.js"></script>
</head>

<body>
    <div class="container-login">
        <div class="login-card">
            <img src="a_ficon.gif" alt="3D MTZ Icon" width="80" height="80" style="margin-bottom: 20px;">
            <h1>3D MTZ Inversion</h1>
            <p style="color: var(--color-text-secondary); margin-bottom: 32px;">
                Войдите для доступа к платформе расчёта обратных задач МТЗ
            </p>
            <button id="google-login-btn" class="btn">
                <svg width="18" height="18" viewBox="0 0 18 18" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M17.64 9.2c0-.637-.057-1.251-.164-1.84H9v3.481h4.844c-.209 1.125-.843 2.078-1.796 2.717v2.258h2.908c1.702-1.567 2.684-3.874 2.684-6.615z" fill="#4285F4"/>
                    <path d="M9.003 18c2.43 0 4.467-.806 5.956-2.18L12.05 13.56c-.806.54-1.836.86-3.047.86-2.344 0-4.328-1.584-5.036-3.711H.96v2.332C2.44 15.983 5.485 18 9.003 18z" fill="#34A853"/>
                    <path d="M3.964 10.712c-.18-.54-.282-1.117-.282-1.71 0-.593.102-1.17.282-1.71V4.96H.957C.347 6.175 0 7.55 0 9.002c0 1.452.348 2.827.957 4.042l3.007-2.332z" fill="#FBBC05"/>
                    <path d="M9.003 3.58c1.321 0 2.508.454 3.44 1.345l2.582-2.58C13.464.891 11.426 0 9.003 0 5.485 0 2.44 2.017.96 4.958L3.967 7.29c.708-2.127 2.692-3.71 5.036-3.71z" fill="#EA4335"/>
                </svg>
                Войти через Google
            </button>
            <div id="error-message" class="error-message hidden"></div>
        </div>
    </div>

    <script src="/js/config/firebase-config.js"></script>

    <script>
        // Инициализация Firebase
        if (typeof firebaseConfig !== 'undefined') {
            firebase.initializeApp(firebaseConfig);
        } else {
            console.error("Конфигурация firebaseConfig не найдена!");
            const errorEl = document.getElementById('error-message');
            errorEl.textContent = "Ошибка инициализации приложения";
            errorEl.classList.remove('hidden');
        }

        document.getElementById('google-login-btn').addEventListener('click', () => {
            const provider = new firebase.auth.GoogleAuthProvider();
            const errorEl = document.getElementById('error-message');

            // Принудительно показываем выбор аккаунта
            provider.setCustomParameters({
                'prompt': 'select_account'
            });

            firebase.auth().signInWithPopup(provider)
                .then((result) => {
                    console.log("Вход успешен:", result.user.uid);
                    window.location.href = '/dashboard.html';
                })
                .catch((error) => {
                    console.error("Ошибка входа:", error);
                    errorEl.textContent = "Ошибка входа: " + error.message;
                    errorEl.classList.remove('hidden');
                });
        });
    </script>
</body>

</html>
