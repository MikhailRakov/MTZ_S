<!-- front/login.html -->
<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enter</title>

    <script src="https://www.gstatic.com/firebasejs/10.10.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.10.0/firebase-auth-compat.js"></script>
</head>

<body style="
    justify-content: center; 
    align-items: center;
    display: flex;
    font-family: Arial, sans-serif;
    color: white;
    background-color: #2B2B31;
    height: 100vh;
    overflow: hidden;
    text-align: center;">
    <div class="container-login">
        <button id="google-login-btn" class="btn" \
        style="background-color: #4285f4;
                color: white;
                border: none;
                padding: 12px 24px;
                text-align: center;
                text-decoration: none;
                display: inline-block;
                font-size: 16px;
                margin: 10px 2px;
                cursor: pointer;
                border-radius: 4px;
                transition: background-color 0.3s;"
    >Login with Google</button>
        <div id="error-message" style="color: red; margin-top: 20px; display: none;"></div>
    </div>

    <script src="/js/config/firebase-config.js"></script>

    <script>
        // Инициализация Firebase
        if (typeof firebaseConfig !== 'undefined') {
            firebase.initializeApp(firebaseConfig);
        } else {
            console.error("Конфигурация firebaseConfig не найдена!");
            document.getElementById('error-message').textContent = "Ошибка инициализации приложения";
            document.getElementById('error-message').style.display = 'block';
        }

        document.getElementById('google-login-btn').addEventListener('click', () => {
            const provider = new firebase.auth.GoogleAuthProvider();

            // Принудительно показываем выбор аккаунта
            provider.setCustomParameters({
                'prompt': 'select_account'
            });

            firebase.auth().signInWithPopup(provider)
                .then((result) => {
                    console.log("Вход успешен:", result.user.uid);
                    // Перенаправляем на dashboard после успешного входа
                    window.location.href = '/dashboard.html';
                })
                .catch((error) => {
                    console.error("Ошибка входа:", error);
                    document.getElementById('error-message').textContent = "Ошибка входа: " + error.message;
                    document.getElementById('error-message').style.display = 'block';
                });
        });
    </script>
</body>

</html>
