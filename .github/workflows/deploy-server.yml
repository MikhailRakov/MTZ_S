name: Deploy Server

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'cmd/**'
      - 'internal/**'
      - 'pkg/**'
      - 'front/**'
      - 'Dockerfile'
      - 'go.mod'
      - 'go.sum'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: mikhailrakov/mtz_s/mtz-server

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build-and-push
    runs-on: self-hosted
    steps:
      - name: Deploy server
        run: |
          set -e
          
          echo "🔐 Создание директорий..."
          mkdir -p ~/mtz-server/logs

          echo "🔑 Декодирование serviceAccountKey.json..."
          echo "${{ secrets.FIREBASE_KEY_BASE64 }}" | base64 -d > ~/mtz-server/serviceAccountKey.json
          chmod 600 ~/mtz-server/serviceAccountKey.json

          echo "📝 Декодирование config.yml..."
          echo "${{ secrets.CONFIG_YML_BASE64 }}" | base64 -d > ~/mtz-server/config.yml
          chmod 644 ~/mtz-server/config.yml
          
          echo " Логин в GHCR..."
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
          
          echo "📥 Загрузка образа..."
          docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          
          echo " Остановка старого контейнера..."
          docker rm -f mtz-server 2>/dev/null || true
          
          echo "🚀 Запуск нового контейнера..."
          docker run -d --name mtz-server \
            -e RABBITMQ_URL=${{ secrets.RABBITMQ_URL }} \
            -e PORT=8080 \
            -e AWS_S3_ENDPOINT=${{ secrets.AWS_S3_ENDPOINT }} \
            -e AWS_S3_REGION=${{ secrets.AWS_S3_REGION }} \
            -e AWS_S3_BUCKET_NAME=${{ secrets.AWS_S3_BUCKET_NAME }} \
            -e AWS_ACCESS_KEY_ID=${{ secrets.AWS_ACCESS_KEY_ID }} \
            -e AWS_SECRET_ACCESS_KEY=${{ secrets.AWS_SECRET_ACCESS_KEY }} \
            -p 8080:8080 \
            -v ~/mtz-server/serviceAccountKey.json:/app/serviceAccountKey.json:ro \
            -v ~/mtz-server/config.yml:/app/config.yml:ro \
            -v ~/mtz-server/logs:/app/logs \
            --restart unless-stopped \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          echo "✅ Деплой завершён!"
          docker ps | grep mtz-server